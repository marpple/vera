name: 기능 제안
description: 새 동작이나 기존 동작의 변경을 제안할 때 등록합니다. 작업을 시작하기 전에 먼저 등록합니다.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 해결하려는 문제
      description: 지금 무엇이 불편하거나 불가능한지, 누가 언제 겪는지를 적습니다.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 제안하는 동작
      description: 변경된 뒤에 허브나 스크립트가 어떻게 동작하는지를 적습니다.
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: 완료 조건
      description: 눈으로 확인할 수 있는 문장으로 적습니다. 이 문장들이 PR의 검증 기준이 됩니다.
      placeholder: |
        - 허브를 다시 시작하면 ...가 표시됩니다.
        - `node --test`에 ...를 확인하는 테스트가 있습니다.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 검토한 다른 방법
      description: 다른 방법을 검토했다면, 그 방법과 선택하지 않은 이유를 적습니다.
  - type: checkboxes
    id: checks
    attributes:
      label: 등록 전 확인
      options:
        - label: 같은 제안을 다루는 이슈가 이미 있는지 검색했습니다.
          required: true
