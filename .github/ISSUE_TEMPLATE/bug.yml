name: Bug report
description: The hub does something other than what the docs say, or a script or page fails.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Do not report a security vulnerability here. Follow the private report steps in [SECURITY.md](https://github.com/marpple/vera/blob/main/SECURITY.md).
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you saw. Paste error messages as they were printed.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What should have happened
      description: What you expected, and where that comes from (a sentence in the README or the skill, for example).
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: In order, so that someone else can follow them.
      placeholder: |
        1. Discuss a feature with Claude Code in an Orca terminal.
        2. Invoke /vera:hub.
        3. ...
    validations:
      required: true
  - type: dropdown
    id: runtime
    attributes:
      label: Where the hub ran
      options:
        - Orca
        - Claude desktop app
        - Does not apply (install, docs, tests)
    validations:
      required: true
  - type: dropdown
    id: agent
    attributes:
      label: Agent
      options:
        - Claude Code
        - Codex
        - Another agent
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Vera version
      description: "The version `claude plugin list` or `codex plugin list` shows."
      placeholder: 0.6.0
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Operating system and node version
      placeholder: macOS 15, node 22
  - type: textarea
    id: logs
    attributes:
      label: Logs and output
      description: "The output of `preflight.cjs`, `sync.log` from the hub folder, terminal output. Remove tokens and secrets first."
      render: shell
  - type: checkboxes
    id: checks
    attributes:
      label: Before you submit
      options:
        - label: I searched the open and closed issues for this problem.
          required: true
        - label: This report holds no token, secret, or private information.
          required: true
